name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_ANALYTICS_URL: ${{ vars.VITE_ANALYTICS_URL != '' && vars.VITE_ANALYTICS_URL || 'https://ge5snsne7lr62h44l7w5bm6z540hkpue.lambda-url.us-east-1.on.aws/' }}
          VITE_TAG_REPO_URL: /mtg-commander-deck-generator/data/tagger-tags.json
          VITE_SPELLCHROMA_DICT_URL: /mtg-commander-deck-generator/data/spellchroma-tag-dictionary.json
          VITE_SPELLCHROMA_INDEX_URL: /mtg-commander-deck-generator/data/spellchroma-tag-index.json
          VITE_SPELLBOOK_COMBOS_URL: /mtg-commander-deck-generator/data/spellbook-combos

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
