name: Refresh Brawl community snapshot

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Regenerate Archidekt snapshot
        run: npm run build:brawl-snapshot

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/brawl-community-snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "chore: refresh Brawl community snapshot [skip aws]"
          git push
